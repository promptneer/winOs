# slirp config
# WinPP S11: Windows(host) <-> WinPP kernel UDP communication
# NOTE: the first line above must stay exactly "# slirp config" (Bochs checks it)
#   virtual net 10.0.2.0/24 ; gateway/host = 10.0.2.2 ; kernel IP = 10.0.2.15
restricted = 0
net        = 10.0.2.0
mask       = 255.255.255.0
host       = 10.0.2.2
dhcpstart  = 10.0.2.15
dns        = 10.0.2.3

# host -> kernel forwarding:
#   Windows sends UDP to 127.0.0.1:7777, slirp delivers it to kernel 10.0.2.15:7777
#   kernel side: chatd 7777 [echo]     (message channel)
hostfwd    = udp::7777-10.0.2.15:7777
#   Windows sends UDP to 127.0.0.1:7778, slirp delivers it to kernel 10.0.2.15:7778
#   kernel side: chatd 7778 cmd        (remote command channel + screen dump back)
#   NOTE: Bochs slirp 的 hostfwd 规则有上限（实测 5 条内 OK），7781/7782 演示端口已注释
hostfwd    = udp::7778-10.0.2.15:7778
# S13 TCP: Windows TCP connects to 127.0.0.1:7779 -> kernel TCP listen 7779
hostfwd    = tcp::7779-10.0.2.15:7779
# S15 httpd: HTTP server (browser -> 127.0.0.1:8080)
hostfwd    = tcp::8080-10.0.2.15:8080
# S15 chat: cross-machine TCP chat (connect 127.0.0.1:7784)
hostfwd    = tcp::7784-10.0.2.15:7784
# 内核主动 connect 10.0.2.2:<port>：slirp 自动转发到宿主对应端口（无需 hostfwd）

# text packet log (debugging)
pktlog     = D:/WinPP/winpp-os/slirp-pktlog.txt
